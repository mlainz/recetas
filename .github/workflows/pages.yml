# Validate the recipes, render the site, publish to GitHub Pages.
#
# No Ruby, no Bundler, no Gemfile. The previous setup was Jekyll built by
# GitLab CI from `image: ruby:latest`; that tag has since moved to Ruby 4.0 and
# Jekyll pulls in eventmachine 1.2.7, a 2018 C extension that must compile, so
# the build had been broken for a long time and the site was serving a
# February 2023 snapshot. tools/build_site.py uses only the standard library,
# which is why there is nothing here to pin or bump.
name: pages

on:
  push:
    branches: [main]
  # So a broken recipe is caught on the PR rather than after merging.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let a running deploy finish rather than cancelling it; a half-published site
# is worse than a slightly stale one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The gate. Runs on pull_request too, so a malformed recipe cannot reach
      # main and break both the site and the Mealie import on the home server.
      - name: Validate recipes
        run: python3 tools/validate.py

      - name: Build site
        run: python3 tools/build_site.py --out public

      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: public

  deploy:
    # Only main publishes. A PR validates and builds, but must not deploy.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
